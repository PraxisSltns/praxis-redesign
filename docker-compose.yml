# The backend's dependencies on a developer's machine: Postgres 16 with pgvector, Redis 7 and an
# S3-compatible bucket (SeaweedFS), each with a health check and a named volume. The gateway and the page run outside
# compose (npm run dev:api, npm run dev); see docs/development.md. Values come from .env, with the same
# local defaults as .env.example. Nothing here is for staging or production.
name: praxis

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-praxis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-praxis}
      POSTGRES_DB: ${POSTGRES_DB:-praxis}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible storage. MinIO's images are no longer published (Docker Hub and quay.io refuse the pull
  # since late 2025), so locally this is SeaweedFS (Apache 2.0), which speaks the same S3 API.
  s3:
    image: chrislusf/seaweedfs:4.50
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-praxis}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-praxis-local-secret}
    ports:
      - "${S3_PORT:-8333}:8333"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 2s
      timeout: 3s
      retries: 60

  # One-shot: makes the bucket once storage is healthy, then exits. Safe to run again.
  s3-bucket:
    image: amazon/aws-cli:2.39.3
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-praxis}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-praxis-local-secret}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-praxis-local}
    entrypoint:
      - /bin/sh
      - -c
      - aws --endpoint-url http://s3:8333 s3api head-bucket --bucket "$$S3_BUCKET" 2>/dev/null || aws --endpoint-url http://s3:8333 s3 mb "s3://$$S3_BUCKET"
    restart: "no"

volumes:
  postgres-data:
  redis-data:
  s3-data:
